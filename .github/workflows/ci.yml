name: CI

on:
  pull_request:

permissions:
  contents: read

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-24.04
            compiler: gcc
          - name: Windows MSVC
            os: windows-2025
            compiler: msvc
          - name: Windows MinGW
            os: windows-2025
            compiler: mingw

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up vcpkg
        shell: bash
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ matrix.compiler }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.compiler }}-

      - name: Create vcpkg binary cache directory
        shell: bash
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo sh -c 'grep -l packages.microsoft.com /etc/apt/sources.list.d/* 2>/dev/null | xargs -r rm -f' || true
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y \
            autoconf autoconf-archive automake libtool libtool-bin libltdl-dev m4 \
            autopoint gettext pkg-config make \
            bison flex \
            libudev-dev \
            libwayland-dev libwayland-bin libxkbcommon-dev \
            libegl1-mesa-dev libgl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev \
            libxmu-dev libxfixes-dev libxss-dev libxtst-dev libxrender-dev libgl-dev \
            libdbus-1-dev libasound2-dev libpulse-dev \
            ninja-build

      - name: Verify build tools (Linux)
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          command -v ninja && ninja --version
          command -v g++ && g++ --version | head -n 1
          command -v autoreconf
          command -v autopoint
          command -v libtoolize

      - name: Set up MSVC
        if: matrix.compiler == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure GCC
        if: matrix.compiler == 'gcc'
        run: |
          for attempt in 1 2 3; do
            cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DENGINE_BUILD_TESTS=ON -DVCPKG_ROOT="$VCPKG_ROOT" && exit 0
            echo "Configure attempt $attempt failed"
            sleep 10
          done
          exit 1

      - name: Configure MSVC
        if: matrix.compiler == 'msvc'
        run: cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DENGINE_BUILD_TESTS=ON -DVCPKG_ROOT="$env:VCPKG_ROOT"

      - name: Configure MinGW
        if: matrix.compiler == 'mingw'
        run: cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DENGINE_BUILD_TESTS=ON -DVCPKG_ROOT="$env:VCPKG_ROOT" -DVCPKG_TARGET_TRIPLET=x64-mingw-dynamic -DVCPKG_HOST_TRIPLET=x64-mingw-dynamic

      - name: Build engine and game
        run: cmake --build build/ci --parallel

      - name: Run unit tests
        run: ctest --test-dir build/ci --output-on-failure

      - name: Upload vcpkg logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs-${{ matrix.name }}
          path: |
            build/ci/vcpkg-manifest-install.log
            vcpkg/buildtrees/**/*.log
          if-no-files-found: ignore

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo sh -c 'grep -l packages.microsoft.com /etc/apt/sources.list.d/* 2>/dev/null | xargs -r rm -f' || true
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install --yes clang-format

      - name: Check formatting
        run: git ls-files -z '*.cpp' '*.h' | xargs -0 clang-format --dry-run --Werror

  sanitizers:
    name: Sanitizers (GCC)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up vcpkg
        shell: bash
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-Linux-gcc-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-Linux-gcc-

      - name: Create vcpkg binary cache directory
        shell: bash
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Install Linux dependencies
        run: |
          sudo sh -c 'grep -l packages.microsoft.com /etc/apt/sources.list.d/* 2>/dev/null | xargs -r rm -f' || true
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y \
            autoconf autoconf-archive automake libtool libtool-bin libltdl-dev m4 \
            autopoint gettext pkg-config make \
            bison flex \
            libudev-dev \
            libwayland-dev libwayland-bin libxkbcommon-dev \
            libegl1-mesa-dev libgl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev \
            libxmu-dev libxfixes-dev libxss-dev libxtst-dev libxrender-dev libgl-dev \
            libdbus-1-dev libasound2-dev libpulse-dev \
            ninja-build

      - name: Verify build tools
        run: |
          command -v ninja && ninja --version
          command -v g++ && g++ --version | head -n 1
          command -v autoreconf
          command -v autopoint
          command -v libtoolize

      - name: Configure sanitizer build
        run: |
          for attempt in 1 2 3; do
            cmake -S . -B build/sanitizers -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENGINE_BUILD_TESTS=ON -DENGINE_ENABLE_SANITIZERS=ON -DVCPKG_ROOT="$VCPKG_ROOT" && exit 0
            echo "Configure attempt $attempt failed"
            sleep 10
          done
          exit 1

      - name: Build sanitizer targets
        run: cmake --build build/sanitizers --parallel

      - name: Run sanitizer tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build/sanitizers --output-on-failure

      - name: Upload vcpkg logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs-sanitizers
          path: |
            build/sanitizers/vcpkg-manifest-install.log
            vcpkg/buildtrees/**/*.log
          if-no-files-found: ignore

  clang-tidy:
    name: clang-tidy report
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up vcpkg
        shell: bash
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-Linux-gcc-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-Linux-gcc-

      - name: Create vcpkg binary cache directory
        shell: bash
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Install Linux dependencies
        run: |
          sudo sh -c 'grep -l packages.microsoft.com /etc/apt/sources.list.d/* 2>/dev/null | xargs -r rm -f' || true
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y \
            autoconf autoconf-archive automake libtool libtool-bin libltdl-dev m4 \
            autopoint gettext pkg-config make \
            bison flex \
            libudev-dev \
            libwayland-dev libwayland-bin libxkbcommon-dev \
            libegl1-mesa-dev libgl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev \
            libxmu-dev libxfixes-dev libxss-dev libxtst-dev libxrender-dev libgl-dev \
            libdbus-1-dev libasound2-dev libpulse-dev \
            clang clang-tidy ninja-build

      - name: Verify build tools
        run: |
          command -v ninja && ninja --version
          command -v clang++ && clang++ --version | head -n 1
          command -v clang-tidy && clang-tidy --version | head -n 1
          command -v autoreconf
          command -v autopoint

      - name: Configure analysis build
        run: |
          for attempt in 1 2 3; do
            cmake -S . -B build/tidy -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DENGINE_BUILD_TESTS=ON -DVCPKG_ROOT="$VCPKG_ROOT" && exit 0
            echo "Configure attempt $attempt failed"
            sleep 10
          done
          exit 1

      - name: Run clang-tidy
        run: git ls-files -z '*.cpp' | xargs -0 clang-tidy -p build/tidy

      - name: Upload vcpkg logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs-clang-tidy
          path: |
            build/tidy/vcpkg-manifest-install.log
            vcpkg/buildtrees/**/*.log
          if-no-files-found: ignore