name: CI

on:
  pull_request:

permissions:
  contents: read

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-24.04
            compiler: gcc
          - name: Windows MSVC
            os: windows-2025
            compiler: msvc
          - name: Windows MinGW
            os: windows-2025
            compiler: mingw
          - name: macOS Apple Clang
            os: macos-14
            compiler: apple-clang

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up vcpkg
        shell: bash
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Set up MSVC
        if: matrix.compiler == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure GCC
        if: matrix.compiler == 'gcc'
        run: cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DENGINE_BUILD_TESTS=ON -DVCPKG_ROOT="$VCPKG_ROOT"

      - name: Configure MSVC
        if: matrix.compiler == 'msvc'
        run: cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DENGINE_BUILD_TESTS=ON -DVCPKG_ROOT="$env:VCPKG_ROOT"

      - name: Configure MinGW
        if: matrix.compiler == 'mingw'
        run: cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DENGINE_BUILD_TESTS=ON -DVCPKG_ROOT="$env:VCPKG_ROOT"

      - name: Configure Apple Clang
        if: matrix.compiler == 'apple-clang'
        run: cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++ -DENGINE_BUILD_TESTS=ON -DVCPKG_ROOT="$VCPKG_ROOT"

      - name: Build engine and game
        run: cmake --build build/ci --parallel

      - name: Run unit tests
        run: ctest --test-dir build/ci --output-on-failure

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install --yes clang-format

      - name: Check formatting
        run: clang-format --dry-run --Werror $(git ls-files '*.cpp' '*.h')

  sanitizers:
    name: Sanitizers (GCC)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up vcpkg
        shell: bash
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure sanitizer build
        run: cmake -S . -B build/sanitizers -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENGINE_BUILD_TESTS=ON -DENGINE_ENABLE_SANITIZERS=ON -DVCPKG_ROOT="$VCPKG_ROOT"

      - name: Build sanitizer targets
        run: cmake --build build/sanitizers --parallel

      - name: Run sanitizer tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build/sanitizers --output-on-failure

  clang-tidy:
    name: clang-tidy report
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up build tools
        run: sudo apt-get update && sudo apt-get install --yes clang-tidy ninja-build

      - name: Configure analysis build
        run: cmake -S . -B build/tidy -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENGINE_BUILD_TESTS=ON -DVCPKG_ROOT="$VCPKG_ROOT"

      - name: Count clang-tidy warnings
        shell: bash
        run: |
          set +e
          clang-tidy -p build/tidy $(git ls-files '*.cpp') 2>&1 | tee clang-tidy.log
          tidy_exit=${PIPESTATUS[0]}
          warning_count=$(grep -Ec 'warning:' clang-tidy.log || true)
          error_count=$(grep -Ec 'error:' clang-tidy.log || true)
          {
            echo "### clang-tidy"
            echo "Warnings: $warning_count"
            echo "Errors: $error_count"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$tidy_exit"