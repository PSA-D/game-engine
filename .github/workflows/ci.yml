name: CI

on:
  pull_request:
  # Runs on main are what fill the vcpkg cache for every new PR: a cache made
  # inside a PR can only be read by that same PR.
  push:
    branches: [ main ]

permissions:
  contents: read

# A new push to a PR cancels the run that is still going for the old commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # vcpkg is pinned to one commit so the binary cache stays valid between runs.
  # To update the libraries: set this to a newer commit of microsoft/vcpkg
  # (`git ls-remote https://github.com/microsoft/vcpkg HEAD`). The first run
  # after that rebuilds the dependencies once and caches them again.
  VCPKG_COMMIT: 9fa95bf687fa6ae7f2da0673a8067e5fc1515c27
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

# Every configure step passes -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON. That
# switches off the "platform-backends" feature in vcpkg.json, so on Linux SDL3
# is built without X11/Wayland/PulseAudio/PipeWire/D-Bus (5 vcpkg packages
# instead of 74). The tests only use SDL's event subsystem, which works without
# them. On Windows SDL3 has no extra backends, so nothing changes there.

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-24.04
            compiler: gcc
          - name: Windows MSVC
            os: windows-2025
            compiler: msvc
            triplet: x64-windows
          - name: Windows MinGW
            os: windows-2025
            compiler: mingw
            triplet: x64-mingw-dynamic

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up vcpkg
        shell: bash
        run: |
          git init -q "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" fetch -q --depth 1 https://github.com/microsoft/vcpkg "$VCPKG_COMMIT"
          git -C "$VCPKG_ROOT" checkout -q FETCH_HEAD
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ matrix.compiler }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.compiler }}-

      - name: Create vcpkg binary cache directory
        shell: bash
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo sh -c 'grep -l packages.microsoft.com /etc/apt/sources.list.d/* 2>/dev/null | xargs -r rm -f' || true
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y ninja-build

      - name: Set up MSVC
        if: matrix.compiler == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure GCC
        if: matrix.compiler == 'gcc'
        run: |
          for attempt in 1 2 3; do
            cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DENGINE_BUILD_TESTS=ON -DENGINE_ENABLE_SANITIZERS=OFF -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON && exit 0
            echo "Configure attempt $attempt failed"
            sleep 10
          done
          exit 1

      - name: Configure MSVC
        if: matrix.compiler == 'msvc'
        run: cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DENGINE_BUILD_TESTS=ON -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON

      - name: Configure MinGW
        if: matrix.compiler == 'mingw'
        run: cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DENGINE_BUILD_TESTS=ON -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON -DVCPKG_TARGET_TRIPLET=x64-mingw-dynamic -DVCPKG_HOST_TRIPLET=x64-mingw-dynamic

      # Saved right after configure (and also when a later step fails), so
      # dependencies that were already built never have to be built again.
      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build engine and game
        run: cmake --build build/ci --parallel

      - name: Run unit tests
        run: ctest --test-dir build/ci --output-on-failure

      - name: Upload vcpkg logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs-${{ matrix.name }}
          path: |
            build/ci/vcpkg-manifest-install.log
            vcpkg/buildtrees/**/*.log
          if-no-files-found: ignore

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo sh -c 'grep -l packages.microsoft.com /etc/apt/sources.list.d/* 2>/dev/null | xargs -r rm -f' || true
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install --yes clang-format

      - name: Check formatting
        run: git ls-files -z '*.cpp' '*.h' | xargs -0 clang-format --dry-run --Werror

  sanitizers:
    name: Sanitizers (GCC)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up vcpkg
        run: |
          git init -q "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" fetch -q --depth 1 https://github.com/microsoft/vcpkg "$VCPKG_COMMIT"
          git -C "$VCPKG_ROOT" checkout -q FETCH_HEAD
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      # Same compiler as the Linux GCC build, so it shares that cache.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-Linux-gcc-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-Linux-gcc-

      - name: Create vcpkg binary cache directory
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Install Linux build tools
        run: |
          sudo sh -c 'grep -l packages.microsoft.com /etc/apt/sources.list.d/* 2>/dev/null | xargs -r rm -f' || true
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y ninja-build

      - name: Configure sanitizer build
        run: |
          for attempt in 1 2 3; do
            cmake -S . -B build/sanitizers -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENGINE_BUILD_TESTS=ON -DENGINE_ENABLE_SANITIZERS=ON -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON && exit 0
            echo "Configure attempt $attempt failed"
            sleep 10
          done
          exit 1

      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build sanitizer targets
        run: cmake --build build/sanitizers --parallel

      - name: Run sanitizer tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build/sanitizers --output-on-failure

      - name: Upload vcpkg logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs-sanitizers
          path: |
            build/sanitizers/vcpkg-manifest-install.log
            vcpkg/buildtrees/**/*.log
          if-no-files-found: ignore

  clang-tidy:
    name: clang-tidy report
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up vcpkg
        run: |
          git init -q "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" fetch -q --depth 1 https://github.com/microsoft/vcpkg "$VCPKG_COMMIT"
          git -C "$VCPKG_ROOT" checkout -q FETCH_HEAD
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-Linux-clang-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-Linux-clang-

      - name: Create vcpkg binary cache directory
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Install Linux build tools
        run: |
          sudo sh -c 'grep -l packages.microsoft.com /etc/apt/sources.list.d/* 2>/dev/null | xargs -r rm -f' || true
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y clang clang-tidy ninja-build

      - name: Configure analysis build
        run: |
          for attempt in 1 2 3; do
            cmake -S . -B build/tidy -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DENGINE_BUILD_TESTS=ON -DENGINE_ENABLE_SANITIZERS=OFF -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON && exit 0
            echo "Configure attempt $attempt failed"
            sleep 10
          done
          exit 1

      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      # run-clang-tidy only checks files that are actually compiled (from
      # compile_commands.json) and runs them in parallel.
      # -Wno-error: the project builds with -Werror, which would turn every
      # clang compiler warning into a failure here. This job is a report, so
      # compiler warnings show up as warnings; real compile errors still fail.
      - name: Run clang-tidy
        run: |
          set -o pipefail
          run-clang-tidy -p build/tidy -j "$(nproc)" -quiet -extra-arg=-Wno-error 2>&1 | tee clang-tidy.log

      - name: Summarize clang-tidy findings
        if: always()
        run: |
          {
            echo "## clang-tidy"
            echo
            echo "Unique warnings: $(grep -E ': warning: ' clang-tidy.log | sort -u | wc -l)"
            echo
            echo "| Count | Check |"
            echo "|---:|---|"
            grep -E ': warning: ' clang-tidy.log | sort -u \
              | grep -oE '\[[a-z0-9.,-]+\]$' | sort | uniq -c | sort -rn | head -n 20 \
              | awk '{ print "| " $1 " | `" $2 "` |" }'
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload clang-tidy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-report
          path: clang-tidy.log
          if-no-files-found: ignore

      - name: Upload vcpkg logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs-clang-tidy
          path: |
            build/tidy/vcpkg-manifest-install.log
            vcpkg/buildtrees/**/*.log
          if-no-files-found: ignore